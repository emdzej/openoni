name: Release

# Triggered by plain semver tags (no "v" prefix): `git tag 0.1.0 && git push origin 0.1.0`; the tag must equal
# `project(OpenOni VERSION ...)` in CMakeLists.txt.
# Builds the gasm module openoni-<version>.wasm and the gasm bundles (openoni.wasm + the released gasm-run,
# GASM_VERSION in tools/fetch-gasm-sdk.sh) for macOS, Linux x86_64/arm64 and Windows x86_64, smoke-tests each
# bundle on its own OS without game data, and attaches everything (with SHA-256 files) to a GitHub Release
# with .github/release-notes.md. No native app and never any game data.
# workflow_dispatch builds the same files as artifacts only (version 0.0.0-snapshot.<sha>).

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write   # to create the Release and upload assets

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="$GITHUB_REF_NAME"
            grep -Eq "^project\(OpenOni VERSION $v( |\))" CMakeLists.txt ||
              { echo "tag $v does not match project(OpenOni VERSION ...) in CMakeLists.txt" >&2; exit 1; }
          else
            v="0.0.0-snapshot.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: fetch wasi-sdk, the gasm C SDK and Binaryen
        run: tools/fetch-gasm-sdk.sh

      - name: build openoni.wasm
        run: |
          cmake -S . -B build-gasm -DOPENONI_PLATFORM=gasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.deps/gasm-c-sdk/cmake/gasm-toolchain.cmake -DWASI_SDK_PREFIX="$PWD/.deps/wasi-sdk" \
            -DGASM_WASM_OPT="$PWD/.deps/binaryen/bin/wasm-opt"
          cmake --build build-gasm -j
          name="openoni-${{ steps.ver.outputs.version }}.wasm"
          cp build-gasm/openoni.wasm "$name"
          sha256sum "$name" > "$name.sha256"
          ls -l "$name"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openoni-wasm
          path: openoni-*.wasm*
          retention-days: 14

  gasm-macos:
    needs: wasm
    runs-on: macos-latest   # iconutil, codesign (ad hoc)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openoni-wasm
          path: wasm
      - name: package
        run: |
          v=$(basename wasm/openoni-*.wasm .wasm); v=${v#openoni-}
          OPENONI_WASM=$(ls wasm/openoni-*.wasm) tools/package-gasm.sh "$v" macos-universal \
            "$(tools/fetch-gasm-runner.sh macos-universal)" dist
      - name: smoke test (no game data)
        run: tools/smoke-gasm-bundle.sh dist/openoni-gasm-*-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openoni-gasm-macos-universal
          path: dist/openoni-gasm-*.zip*
          retention-days: 14

  gasm-package:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openoni-wasm
          path: wasm
      - name: package (Linux x86_64 and arm64, Windows x86_64)
        run: |
          v=$(basename wasm/openoni-*.wasm .wasm); v=${v#openoni-}
          for p in linux-x86_64 linux-arm64 windows-x86_64; do
            OPENONI_WASM=$(ls wasm/openoni-*.wasm) tools/package-gasm.sh "$v" "$p" "$(tools/fetch-gasm-runner.sh "$p")" "dist/$p"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: openoni-gasm-linux-x86_64
          path: dist/linux-x86_64/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: openoni-gasm-linux-arm64
          path: dist/linux-arm64/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: openoni-gasm-windows-x86_64
          path: dist/windows-x86_64/*
          retention-days: 14

  gasm-smoke-linux:
    needs: gasm-package
    strategy:
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openoni-gasm-linux-${{ matrix.arch }}
          path: dist
      - name: runtime libraries (ALSA)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2t64
      - name: smoke test (no game data)
        run: tools/smoke-gasm-bundle.sh dist/openoni-gasm-*-linux-${{ matrix.arch }}.tar.gz

  gasm-smoke-windows:
    needs: gasm-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openoni-gasm-windows-x86_64
          path: dist
      - name: smoke test (no game data)
        shell: pwsh
        run: tools/smoke-gasm-bundle.ps1 dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wasm, gasm-macos, gasm-package, gasm-smoke-linux, gasm-smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "OpenOni $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
