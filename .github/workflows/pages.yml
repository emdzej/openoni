name: Pages

# Builds and deploys the VitePress site to GitHub Pages at https://openoni.emdzej.pl/ (the custom-domain
# CNAME ships in docs/public/CNAME).
#
# The browser player (docs/public/play/) needs openoni.wasm, so the module is built first and copied in by
# docs/scripts/copy-wasm.sh; the player's gasm and csfs runtime is vendored from the npm packages pinned in
# docs/package.json (docs/scripts/vendor-web.sh). Only the engine goes into the site: the game data always
# comes from the player's own copy of the game, in their browser.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tools/fetch-gasm-sdk.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # lastUpdated timestamps

      # SDK version: in tools/fetch-gasm-sdk.sh (keep @emdzej/gasm-host in docs/package.json in step).
      - name: fetch wasi-sdk, the gasm C SDK and Binaryen
        run: tools/fetch-gasm-sdk.sh

      - name: build openoni.wasm
        run: |
          cmake -S . -B build-gasm -DOPENONI_PLATFORM=gasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.deps/gasm-c-sdk/cmake/gasm-toolchain.cmake -DWASI_SDK_PREFIX="$PWD/.deps/wasi-sdk" \
            -DGASM_WASM_OPT="$PWD/.deps/binaryen/bin/wasm-opt"
          cmake --build build-gasm -j

      - name: copy openoni.wasm into the play page
        run: docs/scripts/copy-wasm.sh build-gasm/openoni.wasm

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: install
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: build VitePress site
        working-directory: docs
        run: |
          scripts/vendor-web.sh
          pnpm build
          test -f .vitepress/dist/play/openoni.wasm
          test -f .vitepress/dist/play/vendor/gasm/gasm-worker.js
          test -f .vitepress/dist/CNAME
      - uses: actions/configure-pages@v6
      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
