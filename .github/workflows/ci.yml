name: CI

# The native build (tools and tests) on macOS and Linux, the gasm module, the gasm bundles for every
# platform (macOS, Linux x86_64 and arm64, Windows x86_64), each smoke-tested on its own OS, and the site.
# The tests that need the game skip without it (no game data is ever in CI). The bundles are kept as the
# run's artifacts for 14 days; release.yml makes the same ones for a tag.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: openoni-extract runs
        run: ./build/openoni-extract 2>&1 | grep -q usage

  gasm:
    # macOS: the headless run there is the one checked locally (ANGLE on Metal).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # SDK, wasi-sdk and Binaryen versions: tools/fetch-gasm-sdk.sh.
      - name: fetch wasi-sdk, the gasm C SDK and Binaryen
        run: tools/fetch-gasm-sdk.sh
      - name: build openoni.wasm and openoni-run.wasm
        run: |
          cmake -S . -B build-gasm -DOPENONI_PLATFORM=gasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.deps/gasm-c-sdk/cmake/gasm-toolchain.cmake -DWASI_SDK_PREFIX="$PWD/.deps/wasi-sdk" \
            -DGASM_WASM_OPT="$PWD/.deps/binaryen/bin/wasm-opt"
          cmake --build build-gasm -j
          ls -l build-gasm/*.wasm
      - name: both load and refuse to start without the game
        run: |
          RUN="$(tools/fetch-gasm-runner.sh macos-universal)/gasm-run"
          for m in openoni openoni-run; do
            if "$RUN" build-gasm/$m.wasm --headless 5 > out.txt 2>&1; then cat out.txt; exit 1; fi
            cat out.txt
            grep -q "OpenOni: game data not found" out.txt
          done
      - uses: actions/upload-artifact@v7
        with:
          name: openoni-wasm
          path: build-gasm/*.wasm
          retention-days: 14

  # The gasm bundles (tools/package-gasm.sh) from the module above, smoke-tested without game data.
  bundle-macos:
    needs: gasm
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: openoni-wasm
          path: wasm
      - name: package and smoke test
        run: |
          OPENONI_WASM=wasm/openoni.wasm tools/package-gasm.sh "0.0.0-ci.${GITHUB_SHA::7}" macos-universal \
            "$(tools/fetch-gasm-runner.sh macos-universal)" dist
          tools/smoke-gasm-bundle.sh dist/openoni-gasm-*-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: openoni-gasm-macos-universal
          path: dist/openoni-gasm-*.zip*
          retention-days: 14

  bundle-package:
    needs: gasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: openoni-wasm
          path: wasm
      - name: shellcheck the launchers and packaging scripts
        run: shellcheck tools/*.sh tools/gasm-bundle/*.sh docs/scripts/*.sh
      - name: package (Linux x86_64 and arm64, Windows x86_64)
        run: |
          for p in linux-x86_64 linux-arm64 windows-x86_64; do
            OPENONI_WASM=wasm/openoni.wasm tools/package-gasm.sh "0.0.0-ci.${GITHUB_SHA::7}" "$p" \
              "$(tools/fetch-gasm-runner.sh "$p")" "dist/$p"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: openoni-gasm-linux-x86_64
          path: dist/linux-x86_64/*
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: openoni-gasm-linux-arm64
          path: dist/linux-arm64/*
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: openoni-gasm-windows-x86_64
          path: dist/windows-x86_64/*
          retention-days: 14

  bundle-smoke-linux:
    needs: bundle-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: openoni-gasm-linux-${{ matrix.arch }}
          path: dist
      - name: runtime libraries (ALSA)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2t64
      - name: smoke test (no game data)
        run: tools/smoke-gasm-bundle.sh dist/openoni-gasm-*-linux-${{ matrix.arch }}.tar.gz

  bundle-smoke-windows:
    needs: bundle-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: openoni-gasm-windows-x86_64
          path: dist
      - name: smoke test (no game data)
        shell: pwsh
        run: tools/smoke-gasm-bundle.ps1 dist

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - working-directory: docs
        run: pnpm install --frozen-lockfile && pnpm build
